<div class="card hover:shadow-lg transition-shadow duration-200 cursor-pointer" 
     (click)="navigateToProject()">
    <div class="flex items-start justify-between mb-4">
        <div class="flex-1">
          <div class="flex items-center space-x-2 mb-1">
            <h3 class="text-lg font-semibold text-secondary-900">{{ project.name }}</h3>
          </div>
          <p class="text-sm text-secondary-600">{{ project.description }}</p>
        </div>
      </div>

      <!-- Project Info -->
      <div class="space-y-3 mb-4">
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-sm text-secondary-600">Created at: {{ project.createdAt | date: 'medium' }}</span>
        </div>
        <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
          <span class="text-sm text-secondary-600">Owner: {{ project.ownerName }}</span>
        </div>
        <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10a2 2 0 002 2h12a2 2 0 002-2V7M2 7l10 5 10-5"/>
            </svg>
          <span class="text-sm text-secondary-600">Repositories: {{ project.totalRepos }}</span>
        </div>
      </div>
 </div>
