<div class="max-h-[600px] overflow-auto">
  <div>
    <div class="flex items-center justify-between mb-6 overflow-auto max-h-[500px]">
      <h3 class="text-xl font-semibold text-secondary-900">
        {{ isEditMode ? 'Edit Project' : 'Add New Project' }}
      </h3>
      <button (click)="closeProjectModal()" class="text-secondary-400 hover:text-secondary-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <form  [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Basic Information -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Project Name</label>
          <input type="text" formControlName="name" name="projectName" required class="input-field">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Responsible</label>
          <input type="text" formControlName="responsible" name="projectResponsible" required class="input-field">
        </div>
      </div>
    
      <!-- Repository Information -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Repository URL</label>
          <input type="url" formControlName="repositoryUrl" name="projectRepositoryUrl" required 
                 placeholder="https://github.com/username/repository.git" class="input-field">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Branch</label>
          <input type="text" formControlName="branch" name="projectBranch" required class="input-field">
        </div>
      </div>
    
      <!-- Target Configuration -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Target Host</label>
          <select formControlName="hostId" name="projectHostId" required class="input-field">
            <option value="">Select a host</option>
            <option *ngFor="let host of hosts" [value]="host.id">{{ host.name }} ({{ host.ipAddress }})</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Target Path</label>
          <input type="text" formControlName="targetPath" name="projectTargetPath" required 
                 placeholder="/var/www/project" class="input-field">
        </div>
      </div>
    
      <!-- Docker Configuration -->
      <div class="border-t border-secondary-200 pt-6">
        <div class="flex items-center mb-4">
          <input type="checkbox" formControlName="isDockerEnabled" name="projectIsDockerEnabled" 
                 class="rounded border-secondary-300 text-primary-600 focus:ring-primary-500 mr-3">
          <label class="text-sm font-medium text-secondary-700">Enable Docker deployment</label>
        </div>
        <div *ngIf="projectForm.get('isDockerEnabled')?.value" class="space-y-4" formGroupName="dockerConfig">
          <div class="flex items-center mb-4">
            <input type="checkbox" formControlName="useDockerCompose" name="projectUseDockerCompose" 
                   class="rounded border-secondary-300 text-primary-600 focus:ring-primary-500 mr-3">
            <label class="text-sm font-medium text-secondary-700">Use Docker Compose</label>
          </div>
    
          <div class="space-y-4">
            <label class="text-sm font-medium text-secondary-700">Port Mapping</label>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-secondary-700 mb-2">Container Port</label>
                <input type="number" 
                      formControlName="containerPort"
                      name="containerPort"
                      placeholder="80"
                      class="input-field"
                      min="1"
                      max="65535">
              </div>
              
              <div>
                <label class="block text-sm font-medium text-secondary-700 mb-2">Host Port</label>
                <input type="number" 
                      formControlName="hostPort"
                      name="hostPort"
                      placeholder="8080"
                      class="input-field"
                      min="1"
                      max="65535">
              </div>
            </div>
          </div>
        </div>
      </div>
    
      <!-- Auto Sync Configuration -->
      <div class="border-t border-secondary-200 pt-6">
        <div class="flex items-center mb-4">
          <input type="checkbox" formControlName="autoSync" name="projectAutoSync"
                 class="rounded border-secondary-300 text-primary-600 focus:ring-primary-500 mr-3">
          <label class="text-sm font-medium text-secondary-700">Enable automatic synchronization</label>
        </div>
      </div>
      
      <div class="flex justify-end space-x-3 pt-6 border-t border-secondary-200">
        <button *ngIf="isEditMode" type="button" (click)="closeProjectModal()" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">{{ isEditMode ? 'Update Project' : 'Create Project' }}</button>
      </div>
    </form>
  </div>
</div>
