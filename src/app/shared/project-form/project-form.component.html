<div class="max-h-[600px] overflow-auto">
  <div>
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-semibold text-secondary-900">
        {{ isEditMode ? 'Edit Project' : 'Add New Project' }}
      </h3>
      <button (click)="closeProjectModal()" class="text-secondary-400 hover:text-secondary-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Basic Information -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Project Name</label>
          <input type="text" formControlName="name" required class="input-field">
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-2">Description</label>
          <input type="text" formControlName="description" class="input-field">
        </div>
      </div>
    
      <!-- Repositories Section -->
      <div formArrayName="repositories">
        <h4 class="text-lg font-medium text-secondary-800 mt-6 mb-4">Repositories</h4>
        <div *ngFor="let repositoryGroup of repositories.controls; let i=index" [formGroupName]="i" class="p-4 border border-secondary-200 rounded-lg mb-4 space-y-4">
          <div class="flex justify-between items-center">
            <h5 class="font-semibold">Repository {{ i + 1 }}</h5>
            <button type="button" (click)="removeRepository(i)" class="text-red-500 hover:text-red-700">Remove</button>
          </div>

          <!-- Repository Information -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-secondary-700 mb-2">Repository Name</label>
              <input type="text" formControlName="name" required class="input-field">
            </div>
            <div>
              <label class="block text-sm font-medium text-secondary-700 mb-2">Repository URL</label>
              <input type="url" formControlName="repositoryUrl" required placeholder="https://github.com/username/repository.git" class="input-field">
            </div>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-secondary-700 mb-2">Branch</label>
            <input type="text" formControlName="branch" required class="input-field">
          </div>
        
          <!-- Target Configuration -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-secondary-700 mb-2">Target Host</label>
              <select formControlName="hostId" required class="input-field">
                <option value="">Select a host</option>
                <option *ngFor="let host of hosts" [value]="host.id">{{ host.name }} ({{ host.ipAddress }})</option>
              </select>
            </div>
            
            <div>
              <label class="block text-sm font-medium text-secondary-700 mb-2">Target Path</label>
              <input type="text" formControlName="targetPath" required placeholder="/var/www/project" class="input-field">
            </div>
          </div>
        
          <!-- Docker & Sync Configuration -->
          <div class="border-t border-secondary-200 pt-4 mt-4">
            <div class="flex items-center mb-2">
              <input type="checkbox" formControlName="isDockerEnabled" class="rounded border-secondary-300 text-primary-600 focus:ring-primary-500 mr-3">
              <label class="text-sm font-medium text-secondary-700">Enable Docker deployment</label>
            </div>
            <div class="flex items-center">
              <input type="checkbox" formControlName="autoSync" class="rounded border-secondary-300 text-primary-600 focus:ring-primary-500 mr-3">
              <label class="text-sm font-medium text-secondary-700">Enable automatic synchronization</label>
            </div>
          </div>
        </div>

        <button type="button" (click)="addRepository()" class="btn-secondary mt-4">Add another repository</button>
      </div>
      
      <div class="flex justify-end space-x-3 pt-6 border-t border-secondary-200">
        <button *ngIf="showActions" type="button" (click)="onCancel()" class="btn-secondary">Cancel</button>
        <button *ngIf="showActions" type="submit" class="btn-primary" [disabled]="!projectForm.valid || isSubmitting">
          {{ isSubmitting ? 'Submitting...' : (isEditMode ? 'Update Project' : 'Create Project') }}
        </button>
      </div>
    </form>
  </div>
</div>
